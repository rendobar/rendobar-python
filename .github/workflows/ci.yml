name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the breaking-change check compares with the last release tag
      - uses: actions/checkout@v4
        with:
          repository: rendobar/openapi
          path: .openapi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Start the conformance mock
        # The mock script and deny-list come from rendobar/openapi; the spec it serves is
        # fern/openapi.json, the one this core was generated from, so a newer published
        # spec cannot fail CI before its regeneration PR exists.
        run: |
          python3 -I .openapi/conformance/mock_server.py fern/openapi.json 4100 requests.jsonl > mock.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -X POST http://127.0.0.1:4100/__reset > /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "The conformance mock did not come up:"; cat mock.log; exit 1
      - name: Tests (conformance scenarios, webhook vectors, README)
        run: uv run --with-editable . --with pytest python -m pytest -q
      - name: Breaking-change check against the last release
        if: matrix.python == '3.13'
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$last" ]; then echo "No release yet, nothing to compare with."; exit 0; fi
          uvx griffe@2.4.1 check rendobar -s src -a "$last"
      - name: Public-surface deny-list
        if: matrix.python == '3.13'
        run: python3 -I .openapi/scripts/deny_list.py
      - name: Fern overrides match the spec, and the generated core is post-processed
        if: matrix.python == '3.13'
        run: |
          python3 -I fern/derive_overrides.py --check
          python3 -I fern/postprocess.py --check
      - name: Build
        if: matrix.python == '3.13'
        run: uv build
  agents:
    # The agent adapters, the framework examples and the full type check, with
    # the optional frameworks installed. Separate from the matrix so a plain install stays the common path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rendobar/openapi
          path: .openapi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Start the conformance mock
        # The mock script and deny-list come from rendobar/openapi; the spec it serves is
        # fern/openapi.json, the one this core was generated from, so a newer published
        # spec cannot fail CI before its regeneration PR exists.
        run: |
          python3 -I .openapi/conformance/mock_server.py fern/openapi.json 4100 requests.jsonl > mock.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -X POST http://127.0.0.1:4100/__reset > /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "The conformance mock did not come up:"; cat mock.log; exit 1
      - name: Install with the agent extras
        run: |
          uv venv
          uv pip install -e ".[langchain,crewai]" pytest pyright mypy "fastapi>=0.115" "django>=5.2" django-stubs
      - name: Full suite with the adapters and examples (LangChain, CrewAI, FastAPI, Django)
        run: .venv/bin/python -m pytest -q
      - name: Types (pyright; every hand-written module and tests/typing_check.py are strict)
        run: .venv/bin/pyright --pythonpath .venv/bin/python
      - name: Types (mypy --strict on the package and a user's code)
        run: |
          .venv/bin/python -m mypy
          .venv/bin/python -m mypy tests/typing_check.py
