name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PAT or app token makes the release PR trigger CI; GITHUB_TOKEN events do not.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  examples-live:
    # The example projects against staging (examples/README.md). A failure stops the publish.
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/examples-live.yml
    secrets:
      RENDOBAR_STAGING_API_KEY: ${{ secrets.RENDOBAR_STAGING_API_KEY }}
      RENDOBAR_STAGING_API_URL: ${{ secrets.RENDOBAR_STAGING_API_URL }}
  publish:
    needs: [release-please, examples-live]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing, no stored token. Only this job can mint one.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1  # attestations are on by default with trusted publishing
