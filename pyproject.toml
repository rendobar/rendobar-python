[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rendobar"
version = "0.1.0"
description = "Rendobar Python SDK: media processing and AI generation API for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rendobar" }]
keywords = ["rendobar", "ffmpeg", "video", "media-processing", "transcode", "api-client", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.6", "typing_extensions>=4.9"]

[project.urls]
Homepage = "https://rendobar.com"
Documentation = "https://rendobar.com/docs/sdks/python"
Source = "https://github.com/rendobar/rendobar-python"
Issues = "https://github.com/rendobar/rendobar-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1.380"]

[tool.hatch.build.targets.wheel]
packages = ["src/rendobar"]
