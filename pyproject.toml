[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rendobar"
version = "0.1.0"
description = "Rendobar Python SDK: the official client for Rendobar's media processing and AI generation API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rendobar" }]
keywords = ["rendobar", "video-api", "ffmpeg-api", "media-processing", "video-processing", "ai", "webhooks", "sdk", "python", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.6", "typing_extensions>=4.9"]

[project.urls]
Homepage = "https://rendobar.com"
Documentation = "https://rendobar.com/docs/sdk/python"
Changelog = "https://rendobar.com/changelog/"
Source = "https://github.com/rendobar/rendobar-python"
Issues = "https://github.com/rendobar/rendobar-python/issues"

[project.optional-dependencies]
# Agent framework adapters (rendobar.agents.*). Floors are the oldest versions tested.
# The adapter needs only langchain-core; langchain is there for `create_agent`, which the README uses.
langchain = ["langchain-core>=1.7,<2", "langchain>=1.0,<2"]
crewai = ["crewai>=1.15,<2"]
# rb.realtime, the event stream over a WebSocket. Imported only when a stream starts.
realtime = ["websockets>=13,<18"]
dev = ["pytest>=8", "pyright>=1.1.380"]

[tool.hatch.build.targets.wheel]
packages = ["src/rendobar"]
# The generator writes tests for its own package layout. They are not ours and never ship.
exclude = ["src/rendobar/_generated/tests"]

[tool.hatch.build.targets.sdist]
exclude = ["src/rendobar/_generated/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["rendobar"]

[[tool.mypy.overrides]]
# Generated by Fern from the spec. Never edited, so never held to the hand-written layer's bar.
module = "rendobar._generated.*"
ignore_errors = true
